<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="480" viewBox="0 0 1200 480"
     role="img" aria-labelledby="title desc">
  <title id="title">periscope 工作链路</title>
  <desc id="desc">图片或路径经 periscope 三协议桥到自带的视觉端点，输出 [Image N] 名称与文字描述，再由 Agent Plugins 兼容 harness、Claude Code、dsh 三种接入层消费。</desc>

  <rect width="1200" height="480" rx="24" fill="#0A0A0A"/>
  <rect x="1" y="1" width="1198" height="478" rx="23" fill="none" stroke="#2A2A2A"/>

  <!-- 顶部：输入 → 桥 → 端点 -->
  <g>
    <rect x="64" y="64" width="260" height="140" rx="16" fill="#141414" stroke="#2A2A2A"/>
    <text x="88" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#9B9488">INPUT</text>
    <text x="88" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#F5F3EE">本地图片 / 路径</text>
    <text x="88" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#9B9488">或远程 URL</text>

    <rect x="470" y="64" width="260" height="140" rx="16" fill="#141414" stroke="#B79A5B"/>
    <text x="494" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#B79A5B">PERISCOPE BRIDGE</text>
    <text x="494" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#F5F3EE">openai · anthropic</text>
    <text x="494" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#9B9488">responses · 三协议</text>

    <rect x="876" y="64" width="260" height="140" rx="16" fill="#141414" stroke="#2A2A2A"/>
    <text x="900" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#9B9488">VISION ENDPOINT · BYOM</text>
    <text x="900" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#F5F3EE">Ollama / LM Studio</text>
    <text x="900" y="172" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#9B9488">自建网关 / 兼容云</text>
  </g>

  <!-- 顶部箭头 -->
  <g>
    <path d="M 324 134 L 466 134" stroke="#6A6A6A" stroke-width="3" fill="none"/>
    <path d="M 458 126 L 470 134 L 458 142" fill="#6A6A6A"/>
    <path d="M 730 134 L 872 134" stroke="#6A6A6A" stroke-width="3" fill="none"/>
    <path d="M 864 126 L 876 134 L 864 142" fill="#6A6A6A"/>
  </g>

  <!-- 中部：describe 输出 -->
  <g>
    <path d="M 600 204 L 600 248" stroke="#6A6A6A" stroke-width="3" fill="none"/>
    <path d="M 592 240 L 600 252 L 608 240" fill="#6A6A6A"/>
    <rect x="380" y="252" width="440" height="52" rx="10" fill="#141414" stroke="#B79A5B"/>
    <text x="404" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#B79A5B">[Image N]</text>
    <text x="512" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#F5F3EE">a.png: 文字描述</text>
  </g>

  <!-- 分叉到三个接入层 -->
  <g>
    <path d="M 600 304 L 600 318" stroke="#6A6A6A" stroke-width="3" fill="none"/>
    <path d="M 234 318 L 966 318" stroke="#6A6A6A" stroke-width="3" fill="none"/>
    <path d="M 234 318 L 234 342" stroke="#6A6A6A" stroke-width="3" fill="none"/>
    <path d="M 600 318 L 600 342" stroke="#6A6A6A" stroke-width="3" fill="none"/>
    <path d="M 966 318 L 966 342" stroke="#6A6A6A" stroke-width="3" fill="none"/>
    <path d="M 226 334 L 234 346 L 242 334" fill="#6A6A6A"/>
    <path d="M 592 334 L 600 346 L 608 334" fill="#6A6A6A"/>
    <path d="M 958 334 L 966 346 L 974 334" fill="#6A6A6A"/>
  </g>

  <!-- 底部：三种接入层 -->
  <g>
    <rect x="64" y="342" width="340" height="130" rx="16" fill="#141414" stroke="#B79A5B"/>
    <text x="88" y="378" font-family="Georgia, 'Times New Roman', 'PingFang SC', sans-serif" font-size="23" font-weight="600" fill="#F5F3EE">Agent Plugins 兼容 harness</text>
    <text x="88" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9B9488">VS Code · Codex · Kiro</text>
    <text x="88" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9B9488">Copilot · Cursor</text>
    <text x="88" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#B79A5B">主形态 · 直接加载</text>

    <rect x="430" y="342" width="340" height="130" rx="16" fill="#141414" stroke="#2A2A2A"/>
    <text x="454" y="378" font-family="Georgia, 'Times New Roman', 'PingFang SC', sans-serif" font-size="23" font-weight="600" fill="#F5F3EE">Claude Code</text>
    <text x="454" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9B9488">专属适配 · hooks + skills</text>
    <text x="454" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9B9488">贴图自动注入 [Image N]</text>
    <text x="454" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8C7342">格式不兼容 · 专属适配</text>

    <rect x="796" y="342" width="340" height="130" rx="16" fill="#141414" stroke="#2A2A2A"/>
    <text x="820" y="378" font-family="Georgia, 'Times New Roman', 'PingFang SC', sans-serif" font-size="23" font-weight="600" fill="#F5F3EE">dsh（periscope-dsh）</text>
    <text x="820" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9B9488">专属适配 · LlmAdapter 桥</text>
    <text x="820" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9B9488">periscope-deepseek 看图</text>
    <text x="820" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8C7342">格式不兼容 · 专属适配</text>
  </g>
</svg>
