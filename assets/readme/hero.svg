<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">periscope —— 给纯文本 coding agent 的视觉桥</title>
  <desc id="desc">periscope 把图片译成文字描述，让只读文字的 coding agent 也能看图。右侧演示转换：报错截图缩略图经过 describe 输出为 [Image 1] 名称与文字描述。</desc>

  <rect width="1200" height="400" rx="24" fill="#0A0A0A"/>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#2A2A2A"/>

  <!-- 左侧标题区 -->
  <text x="64" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="6" fill="#B79A5B">VISUAL BRIDGE FOR CODING AGENTS</text>
  <text x="60" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" letter-spacing="1" fill="#F5F3EE">periscope</text>
  <text x="64" y="274" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="600" fill="#F5F3EE">给纯文本 coding agent 的视觉桥：</text>
  <text x="64" y="310" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#9B9488">把图片译成文字描述。</text>
  <text x="64" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="500" fill="#9B9488">Agent Plugins 1.0.0 · BYOM 三协议 · Node ≥ 22 · 零构建零依赖</text>

  <!-- 右侧演示面板 -->
  <g>
    <rect x="700" y="88" width="436" height="224" rx="16" fill="#141414" stroke="#2A2A2A"/>

    <!-- 图片缩略图（报错截图示意） -->
    <g>
      <rect x="716" y="108" width="160" height="124" rx="10" fill="#0A0A0A" stroke="#2A2A2A"/>
      <text x="730" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#B79A5B">[IMAGE]</text>
      <rect x="730" y="146" width="120" height="10" rx="2" fill="#2E2E2E"/>
      <rect x="730" y="164" width="96" height="10" rx="2" fill="#2E2E2E"/>
      <rect x="730" y="182" width="132" height="10" rx="2" fill="#8C7342"/>
      <rect x="730" y="200" width="108" height="10" rx="2" fill="#2E2E2E"/>
    </g>

    <!-- 转换箭头 -->
    <g>
      <path d="M 882 170 L 908 170" stroke="#6A6A6A" stroke-width="3" fill="none"/>
      <path d="M 900 162 L 912 170 L 900 178" fill="#6A6A6A"/>
    </g>

    <!-- describe 输出块 -->
    <g>
      <rect x="916" y="108" width="200" height="124" rx="10" fill="#0A0A0A" stroke="#2A2A2A"/>
      <text x="932" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#B79A5B">[Image 1]</text>
      <text x="1018" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F5F3EE">a.png</text>
      <text x="932" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#F5F3EE">error TS2322:</text>
      <text x="932" y="179" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#F5F3EE">Type 'string' is not</text>
      <text x="932" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#9B9488">assignable to type</text>
      <text x="932" y="217" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#9B9488">'number'</text>
    </g>

    <text x="918" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9B9488" text-anchor="middle">图片 ─▶ 文字描述</text>
  </g>
</svg>
